<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FREE ROBUX GENERATOR 2026</title>
    <style>
        body {
            background-color: #191B1D;
            color: #FFFFFF;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .container {
            background-color: #262B30;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid #00A2FF;
        }

        h1 {
            color: #00A2FF;
            font-size: 24px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        input[type="text"] {
            width: 80%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #111;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        button {
            background-color: #00A2FF;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0082CC;
        }

        /* Стили для скримера */
        #screamer-layer {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: black;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        #screamer-layer img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Эффект тряски */
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            75% { transform: translate(2px, 1px) rotate(-1deg); }
            90% { transform: translate(-1px, -1px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шаг 1: Ник -->
        <div class="step active" id="step1">
            <h1>Генератор Робуксов</h1>
            <p>Введите ваш никнейм в Roblox:</p>
            <input type="text" id="username" placeholder="Player123...">
            <br>
            <button onclick="nextStep(2)">Далее</button>
        </div>

        <!-- Шаг 2: Количество -->
        <div class="step" id="step2">
            <h1>Выбор суммы</h1>
            <p>Сколько Робоуксов вам нужно?</p>
            <input type="text" value="10,000" disabled style="color: #00A2FF; font-weight: bold;">
            <br>
            <button onclick="nextStep(3)">Получить</button>
        </div>

        <!-- Шаг 3: Шуточный фейк-запрос кукис -->
        <div class="step" id="step3">
            <h1 style="color: #FF3333;">Проверка безопасности!</h1>
            <p>Для подтверждения, что вы не робот, введите ваши секретные Cookie-файлы (напишите любое слово):</p>
            <input type="text" id="fake-cookie" placeholder="Например: куки...">
            <br>
            <button onclick="startScreamer()">АКТИВИРОВАТЬ ROBUX</button>
        </div>
    </div>

    <!-- Полноэкранный скример -->
    <div id="screamer-layer">
        <!-- Жуткая зомби-девочка через открытый источник -->
        <img src="https://unsplash.com" alt="BOO!">
    </div>

    <script>
        function nextStep(stepNumber) {
            // Переключение экранов
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + stepNumber).classList.add('active');
        }

        function startScreamer() {
            // Показываем слой со скримером
            const screamer = document.getElementById('screamer-layer');
            screamer.style.display = 'flex';

            // Генерируем жуткий громкий звук через встроенный синтезатор частот браузера,
            // чтобы не зависеть от внешних аудио-файлов (работает со 100% гарантией)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Создаем сильный искаженный шум (крик)
            for (let i = 0; i < 5; i++) {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = i % 2 === 0 ? 'sawtooth' : 'triangle'; // Агрессивная форма волны
                oscillator.frequency.setValueAtTime(100 + (i * 150), audioCtx.currentTime); // Смесь частот
                oscillator.frequency.exponentialRampToValueAtTime(800 + (i * 300), audioCtx.currentTime + 1.5);
                
                gainNode.gain.setValueAtTime(1.5, audioCtx.currentTime); // Высокая громкость
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 2); // Затухание через 2 секунды
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 2);
            }
        }
    </script>
</body>
</html>
